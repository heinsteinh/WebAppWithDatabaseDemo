# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger: 'none' # will disable CI builds entirely

pool:
  vmImage: 'windows-latest'
    
variables:
  BuildConfiguration: release
  
steps:

- task: UseDotNet@2
  displayName: 'Install net3_1_x'
  inputs:
    packageType: 'runtime'
    version: '3.1.x'

- task: UseDotNet@2
  displayName: 'Install net5_x'
  inputs:
    packageType: 'runtime'
    version: '5.x'
- task: UseDotNet@2
  displayName: 'Install .NET Core runtime'
  inputs:
    packageType: "runtime"
    version: "8.0.6"

- task: UseDotNet@2
  displayName: Install .NET 6 sdk
  inputs:
    packageType: sdk
    version: 6.0.x
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: UseDotNet@2
  displayName: Install .NET 8.0 runtime for testing
  inputs:
    packageType: 'runtime'
    version: '8.0.x'

- task: UseDotNet@2
  displayName: Install .NET 9.0 SDK for build
  inputs:
    packageType: 'sdk'
    version: '9.0.x'
- task: DotNetCoreCLI@2
  displayName: Restore Nuget Packages
  inputs:
    command: restore
    projects: '**/WebApp.csproj'

- task: DotNetCoreCLI@2
  displayName: Build Web App
  inputs:
    projects: '**/WebApp.csproj'
    arguments: '--configuration $(BuildConfiguration)'


- task: DotNetCoreCLI@2
  displayName: Create Web App Package (.zip)
  inputs:
    command: publish
    publishWebProjects: True
    arguments: '--configuration $(BuildConfiguration) --output $(build.artifactstagingdirectory)'
    zipAfterPublish: True

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact (WebApp.zip)'
  inputs:
    PathtoPublish: '$(build.artifactstagingdirectory)'